version: '3.8'

services:
  app:
    build: .
    container_name: seafood-qms-app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - REACT_APP_FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - REACT_APP_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - REACT_APP_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - REACT_APP_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
      - REACT_APP_FIREBASE_APP_ID=${FIREBASE_APP_ID}
    volumes:
      # Persist SQLite database
      - app-data:/app/data
      # Persist logs
      - app-logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: seafood-qms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-nginx

  # Optional: Backup service
  backup:
    image: alpine:latest
    container_name: seafood-qms-backup
    volumes:
      - app-data:/data:ro
      - ./backups:/backups
    entrypoint: /bin/sh -c "while true; do sleep 86400; cp /data/seafood_qms.db /backups/backup_$$(date +%Y%m%d).db; done"
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - with-backup

volumes:
  app-data:
    driver: local
  app-logs:
    driver: local

networks:
  app-network:
    driver: bridge
